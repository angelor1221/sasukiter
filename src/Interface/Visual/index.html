<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patreon</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Minha Rede Social</h1>



    <!-- ================================= -->
    <!-- SEÇÃO DE USUÁRIOS -->
    <!-- ================================= -->

    <div class="tabs">

        <!-- ================================= -->
        <!-- BOTÕES DE NAVEGAÇÃO -->
        <!-- ================================= -->

        <input type="radio" name="pagina" id="tab-usuarios" checked>

        <label for="tab-usuarios">
            👤 Usuários
        </label>


        <input type="radio" name="pagina" id="tab-posts">

        <label for="tab-posts">
            📝 Posts
        </label>


        <!-- ================================= -->
        <!-- SEÇÃO DE USUÁRIOS -->
        <!-- ================================= -->

        <section id="usuarios-section">

            <h2>Usuários</h2>

            <div class="criar-usuario">

                <h3>Criar usuário</h3>

                <form id="formUsuario">

                    <input id="nome" type="text" placeholder="Nome" required>

                    <input id="email" type="email" placeholder="Email" required>

                    <input id="senha" type="password" placeholder="Senha" required>

                    <input id="cpf" type="text" placeholder="CPF" required>

                    <button type="submit">
                        Cadastrar usuário
                    </button>

                </form>

            </div>


            <div class="usuarios-cadastrados">

                <h3>Usuários cadastrados</h3>

                <div id="listaUsuarios"></div>

            </div>

        </section>


        <!-- ================================= -->
        <!-- SEÇÃO DE POSTS -->
        <!-- ================================= -->

        <section id="posts-section">

            <h2>Posts</h2>

            <div class="criar-post">

                <h3>Criar post</h3>

                <form id="formPost">

                    <input id="titulo" type="text" placeholder="Título" required>

                    <textarea id="texto" placeholder="Texto" required></textarea>

                    <label for="imagem">
                        Imagem (opcional)
                    </label>

                    <input id="imagem" type="file" accept="image/*">

                    <select id="autor" required>

                        <option value="">
                            Selecione um autor
                        </option>

                    </select>

                    <button type="submit">
                        Criar post
                    </button>

                </form>

            </div>


            <div class="posts-publicados">

                <h3>Posts publicados</h3>

                <div id="listaPosts"></div>

            </div>

        </section>

    </div>

    <script type="module" src="./app.js"></script>

</body>

</html>
